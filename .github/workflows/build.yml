name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    # Step 3: Install necessary dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-dev build-essential libssl-dev libffi-dev libsqlite3-dev libncurses5 libgdbm-dev libbz2-dev
        sudo apt-get install -y openjdk-11-jdk
        sudo apt-get install -y libncurses5 libncurses5-dev libreadline-dev libssl-dev
        sudo apt-get install -y zip unzip

    # Step 4: Install Buildozer
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer

    # Step 5: Install Android SDK (needed for Buildozer to generate APK)
    - name: Install Android SDK
      run: |
        # Setup Android SDK
        wget https://dl.google.com/android/repository/commandlinetools-linux-8092744_latest.zip
        unzip commandlinetools-linux-8092744_latest.zip -d android-sdk
        mkdir -p $HOME/android-sdk/cmdline-tools
        mv android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools
        rm -rf commandlinetools-linux-8092744_latest.zip
        
        # Set environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    # Step 6: Accept licenses (important for Buildozer to work)
    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses

    # Step 7: Verify the buildozer.spec path (adjust it accordingly)
    - name: Verify buildozer.spec path
      run: |
        if [ -f "src/android_project/buildozer.spec" ]; then
          echo "Found buildozer.spec, proceeding with build"
        else
          echo "buildozer.spec not found, aborting build"
          exit 1
        fi

    # Step 8: Run Buildozer to build APK
    - name: Build APK with Buildozer
      run: |
        cd src/android_project  # Adjust if your project directory differs
        buildozer -v android debug

    # Step 9: Upload APK (if found)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v2
      with:
        name: apk
        path: src/android_project/bin/*.apk  # This should match the APK path generated by Buildozer
