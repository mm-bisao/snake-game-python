name: Build APK

on:
  push:
    branches:
      - main  # Ou a branch que você estiver usando para o código

jobs:
  build:
    runs-on: ubuntu-latest  # A plataforma de compilação que será usada

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Usando Python 3.8

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev build-essential libssl-dev libffi-dev libsqlite3-dev
          sudo apt-get install -y libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev
          sudo apt-get install -y libbz2-dev zlib1g-dev liblzma-dev
          
          # Instalar setuptools corretamente
          sudo apt-get install -y python3-setuptools
          
          # Atualizar pip
          pip install --upgrade pip
          pip install buildozer

      - name: Install Android SDK
        run: |
          # Criar o diretório Android SDK, se necessário
          mkdir -p $GITHUB_WORKSPACE/Android/Sdk/cmdline-tools  # Criar diretório para o SDK Android
          
          # Baixar o SDK do Android
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -o commandlinetools.zip
          unzip commandlinetools.zip -d $GITHUB_WORKSPACE/Android/Sdk/cmdline-tools  # Extrair SDK
          rm commandlinetools.zip  # Remover arquivo zip após extração
          
          # Configurar o Android SDK no ambiente
          echo "export ANDROID_HOME=$GITHUB_WORKSPACE/Android/Sdk" >> $GITHUB_ENV
          echo "export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: Ensure build layout
        run: |
          # Verificar se o diretório "snake-game-python" existe, senão criar
          if [ ! -d "$GITHUB_WORKSPACE/snake-game-python" ]; then
            echo "Diretório 'snake-game-python' não encontrado. Criando."
            mkdir $GITHUB_WORKSPACE/snake-game-python
          fi

          # Mover os arquivos, mas NÃO mover o próprio diretório snake-game-python
          for file in $(ls $GITHUB_WORKSPACE); do
            if [ "$file" != "snake-game-python" ]; then
              mv $GITHUB_WORKSPACE/$file $GITHUB_WORKSPACE/snake-game-py
