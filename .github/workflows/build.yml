name: Build Android App

on:
  push:
    branches:
      - main  # Specify the branch to trigger the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'  # Corrected to use Adoptium

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget curl unzip python3-pip openjdk-11-jdk
        pip install cython

    - name: Install Android SDK Command Line Tools
      run: |
        # Ensure the Android SDK directory exists
        mkdir -p $HOME/android-sdk/cmdline-tools

        # Download the latest SDK command line tools zip
        wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip

        # Unzip the downloaded SDK tools to the correct location
        unzip commandlinetools-linux-7583922_latest.zip -d $HOME/android-sdk/cmdline-tools/

        # Ensure the 'latest' directory exists and contains the tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

        # Set up the environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    - name: Confirm sdkmanager location
      run: |
        echo "Verifying sdkmanager path"
        ls $HOME/android-sdk/cmdline-tools/latest/bin

    - name: Accept SDK licenses
      run: |
        export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses

    - name: Install SDK packages
      run: |
        export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
        sdkmanager "platform-tools"
        sdkmanager "build-tools;30.0.3"
        sdkmanager "tools"
        sdkmanager "platforms;android-30"

    - name: Install dependencies for Buildozer
      run: |
        pip install buildozer

    - name: Set up Android SDK and NDK paths
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529
        export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

    # Check if the android_project directory exists before attempting to cd into it
    - name: Check if android_project directory exists
      run: |
        if [ -d "src/android_project" ]; then
          echo "Directory exists, changing into src/android_project"
          cd src/android_project
        else
          echo "Directory src/android_project not found. Skipping this step."
        fi

    - name: Build the Android app with Buildozer
      run: |
        # Make sure we're in the correct directory if it exists
        if [ -d "src/android_project" ]; then
          buildozer -v android debug
        else
          echo "Skipping Buildozer step as directory src/android_project was not found."
        fi

    # Add this step to verify the APK generation location
    - name: Check generated files after build
      run: |
        # List files in the current directory to verify where the APK is
        ls -R

    # Upload the correct APK path after confirming location
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          **/bin/*.apk  # This searches in all directories and subdirectories for APKs
