name: Build Android App

on:
  push:
    branches:
      - main  # Specify the branch to trigger the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'  # Corrected to use Adoptium

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget curl unzip python3-pip openjdk-11-jdk
        pip install cython

    - name: Install Android SDK Command Line Tools
      run: |
        # Create the directory if it doesn't exist
        mkdir -p $HOME/android-sdk/cmdline-tools

        # Download and unzip SDK command line tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip
        unzip commandlinetools-linux-7583922_latest.zip -d $HOME/android-sdk/cmdline-tools

        # Check if the tools were extracted correctly
        ls -l $HOME/android-sdk/cmdline-tools

        # Set up the environment variables for SDK location
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    - name: Confirm sdkmanager location
      run: |
        echo "Verifying sdkmanager path"
        ls $HOME/android-sdk/cmdline-tools/latest/bin

    - name: Accept SDK licenses
      run: |
        export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses

    - name: Install SDK packages
      run: |
        export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
        sdkmanager "platform-tools"
        sdkmanager "build-tools;30.0.3"
        sdkmanager "tools"
        sdkmanager "platforms;android-30"

    - name: Install dependencies for Buildozer
      run: |
        pip install buildozer

    - name: Set up Android SDK and NDK paths
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529
        export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

    - name: Build the Android app with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
