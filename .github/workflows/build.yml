name: Build Android App

on:
  push:
    branches:
      - main  # You can specify the branch you want to trigger the build on

jobs:
  build:
    runs-on: ubuntu-latest  # or use a specific runner depending on your setup

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adoptopenjdk'

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget curl unzip python3-pip openjdk-11-jdk
        pip install cython

    - name: Install Android SDK
      run: |
        # Download and unzip Android SDK command-line tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip
        unzip commandlinetools-linux-7583922_latest.zip -d $HOME/android-sdk
        # Set environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/21.4.7075529" >> $GITHUB_ENV
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

    - name: Accept SDK licenses
      run: |
        yes | sdkmanager --licenses

    - name: Install SDK packages
      run: |
        sdkmanager "platform-tools"
        sdkmanager "build-tools;30.0.3"  # Ensure that the build tools version matches your project
        sdkmanager "tools"
        sdkmanager "platforms;android-30"  # You can change this to match your target API

    - name: Install dependencies for Buildozer
      run: |
        pip install buildozer

    - name: Set up Android SDK and NDK paths
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529
        export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

    - name: Build the Android app with Buildozer
      run: |
        buildozer -v android debug  # Adjust this to your specific buildozer command if needed

    - name: Upload APK artifact
      uses: actions/upload-artifact@v2
      with:
        name: android-apk
        path: bin/*.apk  # Path where the APK is generated
